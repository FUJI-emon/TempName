<script src="./navigation.js?v=10"></script>
<script>
document.addEventListener("DOMContentLoaded", async function () {
  const historyContainer = document.getElementById("history-list-container");

  try {
    const res = await window.API.learning.getCourses();
    if (res.status === "success" && res.courses && res.courses.length > 0) {
      renderCourses(res.courses);
    } else {
      renderEmptyState();
    }
  } catch (err) {
    console.error("Failed to load courses history", err);
    renderEmptyState();
  }

  function renderCourses(courses) {
    historyContainer.innerHTML = "";
    courses.forEach((course) => {
      const card = document.createElement("article");
      card.className = "bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_rgba(94,92,230,0.08)] flex flex-col group hover:shadow-[0px_8px_30px_rgba(94,92,230,0.12)] transition-all duration-300 relative overflow-hidden border border-surface-variant/50 hover:-translate-y-1 cursor-pointer";

      const progress = course.progress || 0;
      const isCompleted = course.status === "completed" || progress >= 100;
      const dateStr = course.created_at || "Recent";

      let statusBadge = `<span class="px-2.5 py-1 rounded-full text-[11px] bg-primary/10 text-primary font-bold">IN PROGRESS</span>`;
      if (isCompleted) {
        statusBadge = `<span class="px-2.5 py-1 rounded-full text-[11px] bg-emerald-500/10 text-emerald-700 font-bold flex items-center gap-1"><span class="material-symbols-outlined text-sm">check_circle</span> COMPLETED</span>`;
      }

      let materialTag = "";
      if (course.has_material && course.material_name) {
        materialTag = `
          <p class="font-label-sm text-xs text-on-surface-variant flex items-center gap-1 mt-1.5 bg-surface-container-low px-2 py-1 rounded border border-outline-variant/30">
            <span class="material-symbols-outlined text-[14px]">description</span>
            Source File: <strong class="text-on-surface font-medium">${escapeHtml(course.material_name)}</strong>
          </p>
        `;
      }

      let actionButtonHtml = "";
      if (isCompleted) {
        actionButtonHtml = `
          <button type="button" class="open-course-btn w-full py-2.5 px-4 rounded-lg border border-outline-variant text-on-surface-variant font-button text-button hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
            Review Course Material
            <span class="material-symbols-outlined">replay</span>
          </button>
        `;
      } else {
        actionButtonHtml = `
          <button type="button" class="resume-lesson-btn w-full py-2.5 px-4 rounded-lg bg-primary text-on-primary font-button text-button hover:bg-primary/90 transition-colors flex items-center justify-center gap-2 shadow-sm">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            Resume Current Lesson
          </button>
        `;
      }

      card.innerHTML = `
        <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full -z-0"></div>
        <!-- Centered Delete Button Overlay on Box Hover -->
        <div class="absolute inset-0 z-30 flex items-center justify-center bg-black/30 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none group-hover:pointer-events-auto rounded-xl">
          <button type="button" class="delete-course-btn px-4 py-2.5 bg-primary text-on-primary hover:bg-primary/90 hover:opacity-80 active:scale-95 rounded-xl border border-primary/30 shadow-xl flex items-center gap-2 text-xs font-bold transition-all duration-200" title="Xóa khóa học này">
            <span class="material-symbols-outlined text-lg">delete</span>
            <span>Xóa khóa học</span>
          </button>
        </div>
        <div class="flex items-start justify-between gap-4 mb-4 relative z-10">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-lg bg-primary-container/20 flex items-center justify-center text-primary shrink-0">
              <span class="material-symbols-outlined text-[28px]">school</span>
            </div>
            <div>
              <h3 class="font-headline-md text-headline-md text-on-surface mb-1 group-hover:text-primary transition-colors font-bold">${escapeHtml(course.title)}</h3>
              <p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">schedule</span>
                Started: ${escapeHtml(dateStr)}
              </p>
              ${materialTag}
            </div>
          </div>
          <div>${statusBadge}</div>
        </div>
        <div class="mt-auto relative z-10 pt-2">
          <div class="flex justify-between items-end mb-2">
            <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">${course.concepts_count || 0} Concepts • ${course.lessons_count || 0} Lessons</span>
            <span class="font-button text-button text-primary font-bold">${progress}%</span>
          </div>
          <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden mb-6">
            <div class="h-full bg-gradient-to-r from-primary to-secondary rounded-full" style="width: ${Math.max(progress, 10)}%"></div>
          </div>
          ${actionButtonHtml}
        </div>
      `;

      // Open Learning Path when card is clicked
      const openLearningPath = async (e) => {
        e.stopPropagation();
        try {
          const detailRes = await window.API.learning.getMaterialDetail(course.material_id);
          if (detailRes.status === "success") {
            window.API.storage.setMaterial(detailRes);
          }
        } catch (e) {}
        window.location.href = `personalized_learning_path.html?material_id=${course.material_id}`;
      };

      // Resume active lesson when Resume button is clicked
      const resumeLesson = async (e) => {
        e.stopPropagation();
        try {
          const detailRes = await window.API.learning.getMaterialDetail(course.material_id);
          if (detailRes.status === "success") {
            window.API.storage.setMaterial(detailRes);
          }
        } catch (e) {}

        if (course.current_step_id) {
          window.location.href = `interactive_lesson_linear_regression_with_sidebar.html?step_id=${course.current_step_id}`;
        } else {
          window.location.href = `personalized_learning_path.html?material_id=${course.material_id}`;
        }
      };

      card.addEventListener("click", openLearningPath);
      const resumeBtn = card.querySelector(".resume-lesson-btn");
      if (resumeBtn) resumeBtn.addEventListener("click", resumeLesson);

      const openBtn = card.querySelector(".open-course-btn");
      if (openBtn) openBtn.addEventListener("click", openLearningPath);

      const deleteBtn = card.querySelector(".delete-course-btn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (window.API?.showDeleteConfirmModal) {
            window.API.showDeleteConfirmModal(course.title, async () => {
              try {
                const res = await window.API.learning.deleteMaterial(course.material_id);
                if (res.status === "success") {
                  card.remove();
                  if (historyContainer.children.length === 0) {
                    renderEmptyState();
                  }
                } else {
                  alert(res.message || "Không thể xóa khóa học.");
                }
              } catch (err) {
                alert("Đã xảy ra lỗi khi xóa khóa học: " + (err.message || err));
              }
            });
          } else {
            alert("Bạn có chắc chắn muốn xóa khóa học này?");
          }
        });
      }

      historyContainer.appendChild(card);
    });
  }

  function renderEmptyState() {
    historyContainer.innerHTML = `
      <div class="col-span-full p-12 text-center bg-surface-container-lowest rounded-2xl shadow-sm border border-surface-variant/50 space-y-4">
        <span class="material-symbols-outlined text-5xl text-outline">school</span>
        <h3 class="font-headline-md text-headline-md text-on-surface">No Courses Found</h3>
        <p class="font-body-md text-on-surface-variant max-w-md mx-auto">You haven't started any learning journeys yet. Upload your first document to generate a personalized course!</p>
        <a href="lumina_learning_upload_document_desktop.html" class="inline-block px-6 py-3 bg-primary text-on-primary font-button text-button rounded-xl shadow-md hover:bg-primary/90 transition-all hover:-translate-y-1">Start New Course</a>
      </div>
    `;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
});
</script>
