<script>
document.addEventListener("DOMContentLoaded", async function () {
  const moduleHeaderTitle = document.getElementById("module-header-title");
  const stepProgressPercent = document.getElementById("step-progress-percent");
  const lessonCardTitle = document.getElementById("lesson-card-title");
  const lessonCardIndex = document.getElementById("lesson-card-index");
  const lessonCardBody = document.getElementById("lesson-card-body");
  const progressFill = document.getElementById("lesson-progress-fill");
  const prevCardBtn = document.getElementById("prev-card-btn");
  const nextCardBtn = document.getElementById("next-card-btn");

  const urlParams = new URLSearchParams(window.location.search);
  const stepIdFromUrl = urlParams.get("step_id");

  let activeStep = null;
  let material = null;
  try {
    activeStep = JSON.parse(localStorage.getItem("lumina.activeStep"));
    material = window.API?.storage?.getMaterial();
  } catch (e) {}

  const currentStepId = stepIdFromUrl || activeStep?.id || 1;
  let currentQuestion = null;
  let selectedOptionId = null;
  let hintsUsed = 0;
  let isAnswered = false;

  let sequenceItems = [];
  let currentIndex = 0;
  let stepData = null;

  if (material && material.title) {
    moduleHeaderTitle.textContent = `Module: ${material.title}`;
  } else {
    moduleHeaderTitle.textContent = `Module: AI Learning Journey`;
  }

  // Fetch Step Quiz, Cards, and Questions from Backend
  try {
    const res = await window.API.learning.getStepQuiz(currentStepId);
    if (res.status === "success") {
      stepData = res;

      if (res.step_title) {
        document.title = `Lumina - ${res.step_title}`;
      }

      if (res.student_status === "locked") {
        renderLockedLessonState(res);
        return;
      }

      buildSequenceItems(res);
      if (sequenceItems.length > 0) {
        renderCurrentItem();
      }
    }
  } catch (err) {
    console.error("Failed to load step quiz/lesson", err);
    lessonCardTitle.textContent = "Lỗi tải bài học";
    lessonCardBody.innerHTML = `<p class="text-rose-500 text-sm font-bold">Không thể kết nối với backend server. Vui lòng thử lại sau.</p>`;
  }

  function renderLockedLessonState(res) {
    stepProgressPercent.textContent = "Locked";
    stepProgressPercent.className = "font-label-sm text-label-sm text-rose-500 font-bold flex items-center gap-1";
    stepProgressPercent.innerHTML = `<span class="material-symbols-outlined text-sm">lock</span><span>Bị khóa</span>`;
    
    lessonCardIndex.textContent = "BÀI HỌC CHƯA MỞ KHÓA";
    lessonCardTitle.textContent = res.step_title || "Bài học bị khóa";
    lessonCardBody.innerHTML = `
      <div class="p-6 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-center flex flex-col items-center gap-3 animate-fade-in-up">
        <span class="material-symbols-outlined text-amber-600 text-5xl">lock</span>
        <h3 class="font-bold text-on-surface text-base">Bạn cần hoàn thành các bài học trước để mở khóa!</h3>
        <p class="text-xs text-on-surface-variant leading-relaxed max-w-md">
          Hãy quay lại Lộ trình học tập cá nhân hóa để tiếp tục theo thứ tự các bước học.
        </p>
        <a href="personalized_learning_path.html" class="mt-2 px-6 py-3 bg-primary text-on-primary font-bold text-xs rounded-xl shadow-md hover:bg-primary/90 transition-all inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>Quay lại Lộ trình học tập</span>
        </a>
      </div>
    `;
    prevCardBtn.disabled = true;
    nextCardBtn.disabled = true;
  }

  function buildSequenceItems(res) {
    sequenceItems = [];
    
    const cards = (res.lesson && res.lesson.cards)
      ? [...res.lesson.cards].sort((a, b) => (a.order_index || 0) - (b.order_index || 0))
      : [];

    const questions = res.questions || [];
    const checkpointQs = res.checkpoints || questions.filter(q => q.question_type === "checkpoint");
    const wrapupQs = res.final_exam || questions.filter(q => q.question_type === "lesson_wrapup");

    const placedCheckpointIds = new Set();

    if (cards.length > 0) {
      cards.forEach((card, idx) => {
        const cardOrder = card.order_index || (idx + 1);
        sequenceItems.push({
          type: "card",
          data: card,
          cardIndex: idx + 1,
          totalCards: cards.length
        });

        // Interleave checkpoint question(s) matching 1-based after_card_order
        const matchingCheckpoints = checkpointQs.filter(
          q => q.after_card_order === cardOrder || q.after_card_order === (idx + 1)
        );
        matchingCheckpoints.forEach(q => {
          if (!placedCheckpointIds.has(q.id)) {
            placedCheckpointIds.add(q.id);
            sequenceItems.push({
              type: "checkpoint",
              question: q
            });
          }
        });
      });
    }

    // Append any unplaced checkpoint questions (if after_card_order > total_cards)
    checkpointQs.forEach(q => {
      if (!placedCheckpointIds.has(q.id)) {
        placedCheckpointIds.add(q.id);
        sequenceItems.push({
          type: "checkpoint",
          question: q
        });
      }
    });

    // Append Final Exam / Wrap-up questions (after_card_order = null) at the end of the lesson
    if (wrapupQs.length > 0) {
      wrapupQs.forEach(q => {
        sequenceItems.push({
          type: "final_test",
          question: q
        });
      });
    }

    // Fallback if res had no cards or questions
    if (sequenceItems.length === 0) {
      sequenceItems.push({
        type: "card",
        data: {
          heading: res.step_title || "Tổng quan bài học",
          body: (res.lesson && res.lesson.explanation) ? res.lesson.explanation : "Bài học đang được biên soạn nội dung."
        },
        cardIndex: 1,
        totalCards: 1
      });
    }
  }

  function renderCurrentItem() {
    const item = sequenceItems[currentIndex];
    const total = sequenceItems.length;
    const progressPct = Math.round(((currentIndex + 1) / total) * 100);
    if (progressFill) progressFill.style.width = `${progressPct}%`;
    stepProgressPercent.textContent = `${progressPct}%`;

    prevCardBtn.disabled = (currentIndex === 0);

    if (item.type === "card") {
      lessonCardIndex.textContent = `Lesson Card ${item.cardIndex} of ${item.totalCards}`;
      lessonCardTitle.textContent = item.data.heading || stepData?.step_title || "Lesson Concept";

      lessonCardBody.innerHTML = "";
      const bodyP = document.createElement("p");
      bodyP.className = "font-body-md text-body-md text-on-surface-variant leading-relaxed whitespace-pre-line";
      bodyP.textContent = item.data.body || "";
      lessonCardBody.appendChild(bodyP);

      if (item.cardIndex === 1 && stepData?.lesson?.example) {
        const codeBox = document.createElement("div");
        codeBox.className = "bg-primary/5 p-4 rounded-xl border border-primary/20 text-xs font-mono text-on-surface my-2 space-y-1";
        codeBox.innerHTML = `<span class="text-primary font-bold block mb-1">💡 Ví dụ thực tế:</span> ${escapeHtml(stepData.lesson.example)}`;
        lessonCardBody.appendChild(codeBox);
      }

      nextCardBtn.querySelector("span").textContent = (currentIndex === total - 1) ? "Hoàn thành bài học" : "Tiếp theo";
      nextCardBtn.onclick = () => {
        if (currentIndex < sequenceItems.length - 1) {
          currentIndex++;
          renderCurrentItem();
        } else {
          showTargetAchievedModal();
        }
      };

    } else if (item.type === "checkpoint" || item.type === "final_test") {
      currentQuestion = item.question;
      selectedOptionId = null;
      hintsUsed = 0;
      isAnswered = false;

      const isFinal = (item.type === "final_test");
      const titleText = isFinal ? "Bài kiểm tra tổng kết (Final Exam)" : "Câu hỏi Checkpoint";
      
      const quizQuestionsCount = sequenceItems.filter(i => i.type === item.type).length;
      const quizCurrentIndex = sequenceItems.slice(0, currentIndex + 1).filter(i => i.type === item.type).length;

      lessonCardIndex.textContent = `${titleText} (${quizCurrentIndex}/${quizQuestionsCount})`;
      lessonCardTitle.textContent = stepData?.step_title || "Kiểm tra kiến thức";

      renderInlineQuizUI(item, isFinal ? "Final Exam" : "Checkpoint");

      const submitText = isFinal ? "Nộp bài Final Exam" : "Nộp bài Checkpoint";
      nextCardBtn.querySelector("span").textContent = submitText;
      
      nextCardBtn.onclick = () => {
        const quizSubmitBtn = document.getElementById("quiz-submit-btn");
        if (!selectedOptionId && !isAnswered) {
          alert("Vui lòng chọn 1 đáp án và bấm Nộp bài trước khi tiếp tục!");
          return;
        }
        if (isAnswered && currentIndex < sequenceItems.length - 1) {
          currentIndex++;
          renderCurrentItem();
        } else if (isAnswered && currentIndex === sequenceItems.length - 1) {
          showTargetAchievedModal();
        } else if (!isAnswered && quizSubmitBtn) {
          quizSubmitBtn.click();
        }
      };
    }
  }

  function renderInlineQuizUI(item, labelTag) {
    const q = item.question;
    const isFinal = (item.type === "final_test");

    lessonCardBody.innerHTML = `
      <div class="flex flex-col gap-5 animate-fade-in-up">
        <div class="p-4 ${isFinal ? 'bg-secondary/10 border-secondary/30' : 'bg-primary/5 border-primary/20'} rounded-xl border flex items-center gap-3">
          <div class="w-10 h-10 rounded-full ${isFinal ? 'bg-secondary text-on-secondary' : 'bg-primary-container text-on-primary-container'} flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined">${isFinal ? 'assignment' : 'quiz'}</span>
          </div>
          <div>
            <h3 class="font-button text-sm text-on-surface font-bold">${escapeHtml(labelTag)}</h3>
            <p class="text-xs text-on-surface-variant">Lumina AI Knowledge Evaluation</p>
          </div>
        </div>

        <div class="p-4 bg-surface-container-low rounded-xl border border-surface-variant/50">
          <p class="font-body-md text-sm text-on-surface font-medium" id="quiz-question-text">${escapeHtml(q.question_text || "Chọn đáp án đúng nhất:")}</p>
        </div>

        <div class="flex flex-col gap-2.5" id="quiz-options-container"></div>

        <div id="hint-text-box" class="hidden p-3 rounded-lg bg-amber-500/10 border border-amber-500/20 text-xs text-amber-900 dark:text-amber-200"></div>
        <div id="quiz-feedback-box" class="hidden p-4 rounded-xl text-sm font-medium flex flex-col gap-2"></div>

        <div class="flex justify-between items-center pt-2 border-t border-surface-variant/50">
          <button id="hint-btn" type="button" class="font-label-sm text-xs text-secondary hover:underline flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">lightbulb</span>
            <span id="hint-btn-text">Gợi ý (Cấp 1)</span>
          </button>
          <button id="quiz-submit-btn" type="button" class="px-5 py-2.5 bg-primary text-on-primary font-button text-xs rounded-lg shadow-sm hover:bg-primary/90 transition-all font-bold">
            Nộp đáp án
          </button>
        </div>
        <button id="next-action-btn" type="button" class="hidden w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-button text-xs rounded-lg shadow-sm transition-all flex items-center justify-center gap-1">
          <span>Tiếp tục học bài tiếp theo</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </div>
    `;

    const optionsContainer = document.getElementById("quiz-options-container");
    const hintBtn = document.getElementById("hint-btn");
    const hintBtnText = document.getElementById("hint-btn-text");
    const hintTextBox = document.getElementById("hint-text-box");
    const quizSubmitBtn = document.getElementById("quiz-submit-btn");
    const quizFeedbackBox = document.getElementById("quiz-feedback-box");
    const nextActionBtn = document.getElementById("next-action-btn");

    if (!q.options || q.options.length === 0) {
      optionsContainer.innerHTML = `<div class="p-3 text-xs text-on-surface-variant text-center">Chưa có lựa chọn cho câu hỏi này.</div>`;
      return;
    }

    q.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quiz-option-btn text-left p-3.5 rounded-xl border border-outline-variant hover:border-primary hover:bg-primary/5 transition-all text-xs text-on-surface flex items-center gap-3";
      btn.setAttribute("data-option-id", opt.id);

      btn.innerHTML = `
        <div class="opt-indicator w-4 h-4 rounded-full border border-outline flex items-center justify-center shrink-0"></div>
        <span class="font-body-md text-xs select-none">${escapeHtml(opt.option_text)}</span>
      `;

      btn.addEventListener("click", () => {
        if (isAnswered) return;
        document.querySelectorAll(".quiz-option-btn").forEach(b => {
          b.classList.remove("border-primary", "bg-primary/10", "ring-2", "ring-primary/30");
          const ind = b.querySelector(".opt-indicator");
          if (ind) ind.classList.remove("bg-primary", "border-primary");
        });
        btn.classList.add("border-primary", "bg-primary/10", "ring-2", "ring-primary/30");
        const indicator = btn.querySelector(".opt-indicator");
        if (indicator) indicator.classList.add("bg-primary", "border-primary");
        selectedOptionId = opt.id;
      });

      optionsContainer.appendChild(btn);
    });

    hintBtn.addEventListener("click", async () => {
      if (!currentQuestion) return;
      hintsUsed = Math.min(hintsUsed + 1, 3);
      hintBtnText.textContent = `Gợi ý (Cấp ${Math.min(hintsUsed + 1, 3)})`;

      try {
        const res = await window.API.learning.getHint(currentQuestion.id, hintsUsed);
        if (res.status === "success" && res.hint) {
          hintTextBox.classList.remove("hidden");
          hintTextBox.innerHTML = `<strong>💡 Gợi ý ${hintsUsed}:</strong> ${escapeHtml(res.hint)}`;
        } else {
          hintTextBox.classList.remove("hidden");
          hintTextBox.innerHTML = `<strong>💡 Gợi ý ${hintsUsed}:</strong> Hãy chú ý lại các khái niệm trọng tâm trong thẻ bài học.`;
        }
      } catch {
        hintTextBox.classList.remove("hidden");
        hintTextBox.innerHTML = `<strong>💡 Gợi ý ${hintsUsed}:</strong> Hãy chú ý lại các khái niệm trọng tâm trong thẻ bài học.`;
      }
    });

    quizSubmitBtn.addEventListener("click", async () => {
      if (!selectedOptionId) {
        alert("Vui lòng chọn 1 đáp án trước khi nộp bài!");
        return;
      }

      quizSubmitBtn.disabled = true;
      quizSubmitBtn.textContent = "Đang kiểm tra...";

      try {
        const payload = {
          question_id: currentQuestion.id,
          selected_option_id: selectedOptionId,
          hints_used: hintsUsed
        };

        const res = await window.API.learning.submitCheckpoint(payload);
        isAnswered = true;

        quizFeedbackBox.classList.remove("hidden", "bg-emerald-500/10", "border-emerald-500/30", "text-emerald-900", "bg-rose-500/10", "border-rose-500/30", "text-rose-900");

        if (res.is_correct) {
          quizFeedbackBox.classList.add("bg-emerald-500/10", "border", "border-emerald-500/30", "text-emerald-900");
          quizFeedbackBox.innerHTML = `
            <div class="flex items-center gap-2 font-bold text-emerald-700">
              <span class="material-symbols-outlined text-lg">check_circle</span>
              <span>Chính xác! Đã trả lời đúng.</span>
            </div>
            <p class="text-xs text-emerald-800/90">${escapeHtml(res.explanation || "Tuyệt vời, bạn đã nắm vững kiến thức này!")}</p>
          `;
        } else {
          quizFeedbackBox.classList.add("bg-rose-500/10", "border", "border-rose-500/30", "text-rose-900");
          quizFeedbackBox.innerHTML = `
            <div class="flex items-center gap-2 font-bold text-rose-700">
              <span class="material-symbols-outlined text-lg">cancel</span>
              <span>Chưa chính xác.</span>
            </div>
            <p class="text-xs text-rose-800/90">${escapeHtml(res.explanation || "Hãy xem lại lý thuyết và thử lại nhé!")}</p>
          `;
        }

        nextActionBtn.classList.remove("hidden");

        if (res.next_action === "complete" || res.is_final_batch) {
          nextActionBtn.querySelector("span").textContent = "Hoàn tất lộ trình học";
          nextActionBtn.onclick = () => showTargetAchievedModal();
        } else if (res.needs_next_batch) {
          nextActionBtn.querySelector("span").textContent = "Đang tạo đợt bài học tiếp theo...";
          const mat = window.API?.storage?.getMaterial();
          const selectedConcepts = window.API?.storage?.getSelectedConcepts();
          if (mat && selectedConcepts) {
            await window.API.learning.generatePath({
              material_id: mat.id || mat.material_id,
              concepts: selectedConcepts
            }).catch(() => {});
          }
          nextActionBtn.querySelector("span").textContent = "Tiếp tục đợt tiếp theo";
          nextActionBtn.onclick = () => {
            window.location.href = "personalized_learning_path.html";
          };
        } else {
          nextActionBtn.querySelector("span").textContent = "Tiếp tục bài học";
          nextActionBtn.onclick = () => {
            if (currentIndex < sequenceItems.length - 1) {
              currentIndex++;
              renderCurrentItem();
            } else {
              showTargetAchievedModal();
            }
          };
        }

      } catch (err) {
        alert(err.message || "Không thể nộp bài. Vui lòng thử lại.");
      } finally {
        quizSubmitBtn.disabled = false;
        quizSubmitBtn.textContent = "Đã nộp bài";
      }
    });
  }

  prevCardBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentItem();
    }
  });

  function showTargetAchievedModal() {
    const modalHtml = `
      <div id="target-achieved-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-surface-container-lowest p-6 rounded-2xl max-w-md w-full shadow-2xl border border-primary/20 space-y-4 text-center animate-fade-in-up">
          <div class="w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-600 flex items-center justify-center mx-auto text-3xl">
            <span class="material-symbols-outlined" style="font-size: 36px;">workspace_premium</span>
          </div>
          <h2 class="font-headline-md text-xl font-bold text-on-surface">Mục tiêu học tập đã hoàn thành!</h2>
          <p class="text-xs text-on-surface-variant leading-relaxed">
            Chúc mừng bạn đã chinh phục toàn bộ các khái niệm trong mục tiêu này. Bạn có muốn kết thúc lộ trình hay tiếp tục học bài tập bổ sung?
          </p>
          <div class="flex flex-col gap-2 pt-2">
            <button id="modal-finish-btn" class="w-full py-3 bg-primary text-on-primary rounded-xl font-button font-bold text-xs shadow-md hover:bg-primary/90 transition-all flex items-center justify-center gap-1">
              <span>Hoàn thành lộ trình học</span>
              <span class="material-symbols-outlined text-base">emoji_events</span>
            </button>
            <button id="modal-bonus-btn" class="w-full py-3 bg-surface-container-high text-primary rounded-xl font-button font-bold text-xs hover:bg-surface-variant transition-all border border-primary/20 flex items-center justify-center gap-1">
              <span>Tiếp tục học bổ sung (Bonus Practice)</span>
              <span class="material-symbols-outlined text-base">add_circle</span>
            </button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML("beforeend", modalHtml);

    document.getElementById("modal-finish-btn").addEventListener("click", () => {
      window.location.href = "final_test_result_summary_review.html";
    });

    document.getElementById("modal-bonus-btn").addEventListener("click", async () => {
      const mat = window.API?.storage?.getMaterial();
      const selectedConcepts = window.API?.storage?.getSelectedConcepts();
      if (mat && selectedConcepts) {
        await window.API.learning.generatePath({
          material_id: mat.id || mat.material_id,
          concepts: selectedConcepts
        }).catch(() => {});
      }
      window.location.href = "personalized_learning_path.html";
    });
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
});
</script>
</body>
</html>
