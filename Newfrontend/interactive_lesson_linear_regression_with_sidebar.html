<script>
document.addEventListener("DOMContentLoaded", async function () {
  const moduleHeaderTitle = document.getElementById("module-header-title");
  const stepProgressPercent = document.getElementById("step-progress-percent");
  const lessonCardTitle = document.getElementById("lesson-card-title");
  const lessonCardIndex = document.getElementById("lesson-card-index");
  const lessonCardTypeTag = document.getElementById("lesson-card-type-tag");
  const lessonCardBody = document.getElementById("lesson-card-body");
  const progressFill = document.getElementById("lesson-progress-fill");
  const prevCardBtn = document.getElementById("prev-card-btn");
  const nextCardBtn = document.getElementById("next-card-btn");
  const sequencePillsContainer = document.getElementById("sequence-pills-container");
  const backToPathBtn = document.getElementById("back-to-path-btn");
  const closeLessonBtn = document.getElementById("close-lesson-btn");

  const urlParams = new URLSearchParams(window.location.search);
  const stepIdFromUrl = urlParams.get("step_id");

  let activeStep = null;
  let material = null;
  try {
    activeStep = JSON.parse(localStorage.getItem("lumina.activeStep"));
    material = window.API?.storage?.getMaterial();
  } catch (e) {}

  let currentStepId = parseInt(stepIdFromUrl, 10);
  if (isNaN(currentStepId)) {
    if (activeStep && activeStep.id && !isNaN(parseInt(activeStep.id, 10))) {
      currentStepId = parseInt(activeStep.id, 10);
    } else {
      currentStepId = 64;
    }
  }

  let currentQuestion = null;
  let selectedOptionId = null;
  let hintsUsed = 0;
  let isAnswered = false;

  let sequenceItems = [];
  let currentIndex = 0;
  let stepData = null;

  // 📊 Quiz Answers & Review Mode State Variables
  let userAnswersMap = {}; // { [question_id]: { selectedOptionId, isCorrect, explanation } }
  let isReviewMode = false;

  // ⏱️ Stopwatches / Timers State Variables (declared before any function call)
  let totalSeconds = 0;
  let cardSeconds = 0;
  let totalTimerInterval = null;
  let cardTimerInterval = null;

  if (material && material.title) {
    moduleHeaderTitle.textContent = `Module: ${material.title}`;
  } else {
    moduleHeaderTitle.textContent = `Module: AI Learning Journey`;
  }

  backToPathBtn.addEventListener("click", () => {
    window.location.href = "personalized_learning_path.html";
  });

  closeLessonBtn.addEventListener("click", () => {
    closeLessonSafely();
  });

  function closeLessonSafely() {
    if (confirm("Do you want to exit the current lesson and return to the Learning Path?")) {
      window.location.href = "personalized_learning_path.html";
    }
  }

  // Fetch Step Quiz data from backend API
  try {
    const res = await window.API.learning.getStepQuiz(currentStepId);
    if (res && res.status === "success") {
      stepData = res;

      if (res.step_title) {
        document.title = `Lumina - ${res.step_title}`;
      }

      if (res.student_status === "locked") {
        renderLockedLessonState(res);
        return;
      }

      buildSequenceItems(res);
      if (sequenceItems.length > 0) {
        renderCurrentItem();
      }
    } else {
      throw new Error(res?.message || "Invalid step quiz payload response");
    }
  } catch (err) {
    console.error("Failed to load step quiz/lesson, attempting fallback load...", err);
    try {
      const fallbackRes = await window.API.learning.getStepQuiz(64);
      if (fallbackRes && fallbackRes.status === "success") {
        stepData = fallbackRes;
        if (fallbackRes.step_title) {
          document.title = `Lumina - ${fallbackRes.step_title}`;
        }
        buildSequenceItems(fallbackRes);
        if (sequenceItems.length > 0) {
          renderCurrentItem();
          return;
        }
      }
    } catch (fbErr) {
      console.error("Fallback step load also failed:", fbErr);
    }

    lessonCardTitle.textContent = "Error Loading Lesson";
    lessonCardBody.innerHTML = `
      <div class="p-6 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-center flex flex-col items-center gap-3">
        <span class="material-symbols-outlined text-rose-600 text-4xl">error</span>
        <p class="text-sm font-bold text-rose-700">Unable to fetch lesson data from server.</p>
        <p class="text-xs text-on-surface-variant mb-2">Please make sure the backend Django server is running and try again.</p>
        <a href="personalized_learning_path.html" class="px-5 py-2.5 bg-primary text-on-primary font-bold text-xs rounded-xl shadow-sm hover:bg-primary/90 transition-all inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">refresh</span>
          <span>Return to Learning Path</span>
        </a>
      </div>
    `;
  }

  function renderLockedLessonState(res) {
    stepProgressPercent.textContent = "Locked";
    stepProgressPercent.className = "font-label-sm text-xs text-rose-500 font-bold flex items-center gap-1";
    stepProgressPercent.innerHTML = `<span class="material-symbols-outlined text-xs">lock</span><span>Locked</span>`;
    
    lessonCardIndex.textContent = "STEP LOCKED";
    lessonCardTypeTag.textContent = "Prerequisite Required";
    lessonCardTitle.textContent = res.step_title || "Step is Locked";
    lessonCardBody.innerHTML = `
      <div class="p-8 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-center flex flex-col items-center gap-4 animate-fade-in-up my-auto">
        <div class="w-16 h-16 rounded-full bg-amber-500/20 text-amber-600 flex items-center justify-center text-3xl">
          <span class="material-symbols-outlined" style="font-size: 36px;">lock</span>
        </div>
        <h3 class="font-bold text-on-surface text-lg">Complete Prerequisite Steps First</h3>
        <p class="text-xs text-on-surface-variant leading-relaxed max-w-md">
          This step is currently locked. Complete the preceding steps in your Personalized Learning Path to unlock this lesson.
        </p>
        <a href="personalized_learning_path.html" class="mt-2 px-6 py-3 bg-primary text-on-primary font-bold text-xs rounded-xl shadow-md hover:bg-primary/90 transition-all inline-flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>Return to Learning Path</span>
        </a>
      </div>
    `;
    prevCardBtn.disabled = true;
    nextCardBtn.disabled = true;
  }

  function buildSequenceItems(res) {
    sequenceItems = [];
    
    const cards = (res.lesson && res.lesson.cards)
      ? [...res.lesson.cards].sort((a, b) => (a.order_index || 0) - (b.order_index || 0))
      : [];

    const questions = res.questions || [];
    const checkpointQs = res.checkpoints || questions.filter(q => q.question_type === "checkpoint");
    const wrapupQs = res.final_exam || questions.filter(q => q.question_type === "lesson_wrapup");

    const placedCheckpointIds = new Set();

    if (cards.length > 0) {
      cards.forEach((card, idx) => {
        const cardOrder = card.order_index || (idx + 1);
        sequenceItems.push({
          type: "card",
          data: card,
          cardIndex: idx + 1,
          totalCards: cards.length
        });

        // Interleave checkpoint question(s) matching 1-based after_card_order
        const matchingCheckpoints = checkpointQs.filter(
          q => q.after_card_order === cardOrder || q.after_card_order === (idx + 1)
        );
        matchingCheckpoints.forEach(q => {
          if (!placedCheckpointIds.has(q.id)) {
            placedCheckpointIds.add(q.id);
            sequenceItems.push({
              type: "checkpoint",
              question: q,
              afterCardOrder: cardOrder
            });
          }
        });
      });
    }

    // Append unplaced checkpoint questions
    checkpointQs.forEach(q => {
      if (!placedCheckpointIds.has(q.id)) {
        placedCheckpointIds.add(q.id);
        sequenceItems.push({
          type: "checkpoint",
          question: q,
          afterCardOrder: q.after_card_order || cards.length
        });
      }
    });

    // Append Final Exam / Wrap-up questions (after_card_order = null)
    if (wrapupQs.length > 0) {
      wrapupQs.forEach((q, idx) => {
        sequenceItems.push({
          type: "final_test",
          question: q,
          testIndex: idx + 1,
          totalTests: wrapupQs.length
        });
      });
    }

    // Fallback if res had no cards or questions
    if (sequenceItems.length === 0) {
      sequenceItems.push({
        type: "card",
        data: {
          heading: res.step_title || "Lesson Overview",
          body: (res.lesson && res.lesson.explanation) ? res.lesson.explanation : "Lesson content is currently being prepared."
        },
        cardIndex: 1,
        totalCards: 1
      });
    }
  }  function renderSequencePills() {
    if (!sequencePillsContainer) return;
    sequencePillsContainer.innerHTML = "";

    sequenceItems.forEach((item, idx) => {
      const pill = document.createElement("div");
      
      let label = "";
      let icon = "";
      let isCurrent = (idx === currentIndex);
      let isCompleted = (idx < currentIndex);

      if (item.type === "card") {
        label = `Card ${item.cardIndex}`;
        icon = "article";
      } else if (item.type === "checkpoint") {
        label = `Checkpoint`;
        icon = "bolt";
      } else if (item.type === "final_test") {
        label = `Exam ${item.testIndex || ""}`;
        icon = "assignment";
      }

      let baseClasses = "px-3 py-1.5 rounded-xl font-label-sm text-xs flex items-center gap-1.5 shrink-0 cursor-pointer select-none border transition-all hover:opacity-100 ";

      if (isCurrent) {
        baseClasses += "bg-primary text-on-primary border-primary font-bold shadow-sm ring-2 ring-primary/20 scale-105";
      } else if (isCompleted) {
        baseClasses += "bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 border-emerald-500/30 font-semibold";
        icon = "check_circle";
      } else {
        baseClasses += "bg-surface-container-low text-on-surface-variant/70 border-outline-variant/30 opacity-60";
      }

      pill.className = baseClasses;
      pill.innerHTML = `<span class="material-symbols-outlined text-sm">${icon}</span><span>${label}</span>`;
      pill.addEventListener("click", () => {
        currentIndex = idx;
        renderCurrentItem();
      });
      sequencePillsContainer.appendChild(pill);
    });
  }

  // ⏱️ Stopwatches / Timers Logic

  function initTimers() {
    if (totalTimerInterval) clearInterval(totalTimerInterval);
    totalSeconds = 0;
    totalTimerInterval = setInterval(() => {
      totalSeconds++;
      const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      const el = document.getElementById("total-lesson-timer");
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);

    resetCardTimer();
  }

  function resetCardTimer() {
    if (cardTimerInterval) clearInterval(cardTimerInterval);
    cardSeconds = 0;
    const el = document.getElementById("current-card-timer");
    if (el) el.textContent = "00:00";

    cardTimerInterval = setInterval(() => {
      cardSeconds++;
      const m = String(Math.floor(cardSeconds / 60)).padStart(2, '0');
      const s = String(cardSeconds % 60).padStart(2, '0');
      if (el) el.textContent = `${m}:${s}`;
    }, 1000);
  }

  function stopTimers() {
    if (totalTimerInterval) clearInterval(totalTimerInterval);
    if (cardTimerInterval) clearInterval(cardTimerInterval);
  }

  function setNextBtnText(txt) {
    if (!nextCardBtn) return;
    const sp = nextCardBtn.querySelector("span");
    if (sp) sp.textContent = txt;
    else nextCardBtn.textContent = txt;
  }

  function renderCurrentItem() {
    if (!sequenceItems || sequenceItems.length === 0) return;
    const item = sequenceItems[currentIndex];
    if (!item) return;
    const total = sequenceItems.length;
    const progressPct = Math.round(((currentIndex + 1) / total) * 100);
    
    if (progressFill) progressFill.style.width = `${progressPct}%`;
    if (stepProgressPercent) stepProgressPercent.textContent = `${progressPct}%`;

    renderSequencePills();

    // Enable previous card button to allow reviewing previous cards
    if (prevCardBtn) {
      prevCardBtn.disabled = (currentIndex === 0);
      prevCardBtn.title = "Quay lại thẻ trước";
    }

    // Reset card timer for current card & init total timer on start
    if (totalSeconds === 0 && !totalTimerInterval) {
      initTimers();
    } else {
      resetCardTimer();
    }

    if (item.type === "card") {
      renderLessonCardView(item, total);
    } else if (item.type === "checkpoint") {
      renderCheckpointView(item, total);
    } else if (item.type === "final_test") {
      renderFinalTestView(item, total);
    }
  }

  function renderOptionsUI(question) {
    const optionsContainer = document.getElementById("quiz-options-container");
    if (!optionsContainer) return;

    if (!question.options || question.options.length === 0) {
      optionsContainer.innerHTML = `<div class="p-4 text-xs text-on-surface-variant text-center">No options available for this question.</div>`;
      return;
    }

    const prefixes = ["A", "B", "C", "D"];
    const savedAns = userAnswersMap[question.id];

    question.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      let btnClasses = "quiz-option-btn text-left p-4 rounded-xl border border-outline-variant/60 hover:border-primary hover:bg-primary/5 transition-all text-xs md:text-sm text-on-surface flex items-center gap-3 bg-surface-container-lowest";
      btn.setAttribute("data-option-id", opt.id);

      let isCorrectOpt = opt.is_correct;
      let isUserChosen = savedAns && String(savedAns.selectedOptionId) === String(opt.id);

      if (savedAns || isReviewMode) {
        if (isCorrectOpt) {
          btnClasses = "quiz-option-btn text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-500/10 font-bold text-xs md:text-sm text-emerald-900 flex items-center gap-3 shadow-sm";
        } else if (isUserChosen && !isCorrectOpt) {
          btnClasses = "quiz-option-btn text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-500/10 font-bold text-xs md:text-sm text-rose-900 flex items-center gap-3 shadow-sm";
        }
      }

      let indicatorHtml = `
        <div class="opt-indicator w-6 h-6 rounded-full border border-outline flex items-center justify-center shrink-0 font-label-sm text-xs font-bold text-on-surface-variant">
          ${prefixes[idx] || (idx + 1)}
        </div>
      `;

      if ((savedAns || isReviewMode) && isCorrectOpt) {
        indicatorHtml = `
          <div class="opt-indicator w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0 font-label-sm text-xs font-bold shadow-sm">
            ✓
          </div>
        `;
      } else if ((savedAns || isReviewMode) && isUserChosen && !isCorrectOpt) {
        indicatorHtml = `
          <div class="opt-indicator w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 font-label-sm text-xs font-bold shadow-sm">
            ✗
          </div>
        `;
      }

      btn.className = btnClasses;
      btn.innerHTML = `
        ${indicatorHtml}
        <span class="font-body-md text-xs md:text-sm font-medium select-none flex-1">${escapeHtml(opt.option_text)}</span>
      `;

      if (!savedAns && !isReviewMode) {
        btn.addEventListener("click", () => {
          if (isAnswered) return;
          document.querySelectorAll(".quiz-option-btn").forEach(b => {
            b.classList.remove("border-primary", "bg-primary/10", "ring-2", "ring-primary/30");
            const ind = b.querySelector(".opt-indicator");
            if (ind) {
              ind.classList.remove("bg-primary", "text-white", "border-primary");
              ind.classList.add("border-outline", "text-on-surface-variant");
            }
          });
          btn.classList.add("border-primary", "bg-primary/10", "ring-2", "ring-primary/30");
          const indicator = btn.querySelector(".opt-indicator");
          if (indicator) {
            indicator.classList.remove("border-outline", "text-on-surface-variant");
            indicator.classList.add("bg-primary", "text-white", "border-primary");
          }
          selectedOptionId = opt.id;
          if (nextCardBtn) {
            nextCardBtn.disabled = false;
            nextCardBtn.title = "";
          }
        });
      }

      optionsContainer.appendChild(btn);
    });

    if (savedAns || isReviewMode) {
      const feedbackBox = document.getElementById("quiz-feedback-box");
      if (feedbackBox) {
        feedbackBox.classList.remove("hidden", "bg-emerald-500/10", "border-emerald-500/30", "text-emerald-900", "bg-rose-500/10", "border-rose-500/30", "text-rose-900");
        const isCorr = savedAns ? savedAns.isCorrect : true;
        const explText = savedAns ? savedAns.explanation : (question.explanation || "Đáp án chính xác theo Database.");
        if (isCorr) {
          feedbackBox.classList.add("bg-emerald-500/10", "border", "border-emerald-500/30", "text-emerald-900");
          feedbackBox.innerHTML = `
            <div class="flex items-center gap-2 font-bold text-emerald-700">
              <span class="material-symbols-outlined text-lg">check_circle</span>
              <span>Trả lời Đúng!</span>
            </div>
            <p class="text-xs text-emerald-800/90 leading-relaxed">${escapeHtml(explText)}</p>
          `;
        } else {
          feedbackBox.classList.add("bg-rose-500/10", "border", "border-rose-500/30", "text-rose-900");
          feedbackBox.innerHTML = `
            <div class="flex items-center gap-2 font-bold text-rose-700">
              <span class="material-symbols-outlined text-lg">cancel</span>
              <span>Lựa chọn Chưa Đúng</span>
            </div>
            <p class="text-xs text-rose-800/90 leading-relaxed">${escapeHtml(explText)}</p>
          `;
        }
      }
      const quizSubmitBtn = document.getElementById("quiz-submit-btn");
      if (quizSubmitBtn) {
        quizSubmitBtn.disabled = true;
        quizSubmitBtn.textContent = "Đã hoàn thành câu hỏi";
        quizSubmitBtn.className = "px-6 py-2.5 bg-surface-variant text-on-surface-variant font-button text-xs rounded-xl opacity-70 cursor-not-allowed font-bold";
      }
    }
  }

  function setupQuizHandlers(item, isFinal) {
    const hintBtn = document.getElementById("hint-btn");
    const hintBtnText = document.getElementById("hint-btn-text");
    const hintTextBox = document.getElementById("hint-text-box");
    const quizSubmitBtn = document.getElementById("quiz-submit-btn");
    const quizFeedbackBox = document.getElementById("quiz-feedback-box");

    if (hintBtn) {
      hintBtn.addEventListener("click", async () => {
        hintsUsed++;
        const currentLevel = Math.min(hintsUsed, 3);
        try {
          const res = await window.API.learning.getHint(currentQuestion.id, currentLevel);
          if (res && res.status === "success" && res.hint) {
            hintTextBox.classList.remove("hidden");
            hintTextBox.innerHTML = `
              <div class="flex items-center gap-1.5 font-bold">
                <span class="material-symbols-outlined text-sm">lightbulb</span>
                <span>Hint Level ${res.level}</span>
              </div>
              <p class="leading-relaxed">${escapeHtml(res.hint)}</p>
            `;
          }
        } catch (e) {
          hintTextBox.classList.remove("hidden");
          hintTextBox.innerHTML = `<p class="leading-relaxed font-semibold text-rose-700">Gợi ý Mức ${currentLevel}: Hãy xem lại lý thuyết trong các thẻ bài học trước đó.</p>`;
        }

        if (currentLevel < 3) {
          hintBtnText.textContent = `Get Hint (Level ${currentLevel + 1})`;
        } else {
          hintBtn.disabled = true;
          hintBtnText.textContent = `Max Hint Level (3/3)`;
        }
      });
    }

    if (quizSubmitBtn) {
      quizSubmitBtn.addEventListener("click", async () => {
        if (!selectedOptionId && !isAnswered) {
          alert("Vui lòng chọn 1 đáp án trước khi bấm Submit!");
          return;
        }

        if (isAnswered) {
          if (currentIndex < sequenceItems.length - 1) {
            currentIndex++;
            renderCurrentItem();
          } else {
            showCompletionSummary();
          }
          return;
        }

        quizSubmitBtn.disabled = true;
        quizSubmitBtn.textContent = "Đang đối chiếu Database...";

        try {
          const payload = {
            question_id: currentQuestion.id,
            selected_option_id: selectedOptionId,
            hints_used: hintsUsed
          };

          const res = await window.API.learning.submitCheckpoint(payload);
          isAnswered = true;

          userAnswersMap[currentQuestion.id] = {
            selectedOptionId: selectedOptionId,
            isCorrect: res.is_correct,
            explanation: res.explanation
          };

          quizFeedbackBox.classList.remove("hidden", "bg-emerald-500/10", "border-emerald-500/30", "text-emerald-900", "bg-rose-500/10", "border-rose-500/30", "text-rose-900");

          if (res.is_correct) {
            quizFeedbackBox.classList.add("bg-emerald-500/10", "border", "border-emerald-500/30", "text-emerald-900");
            quizFeedbackBox.innerHTML = `
              <div class="flex items-center gap-2 font-bold text-emerald-700">
                <span class="material-symbols-outlined text-lg">check_circle</span>
                <span>Correct Answer!</span>
              </div>
              <p class="text-xs text-emerald-800/90 leading-relaxed">${escapeHtml(res.explanation || "Great job! You have mastered this concept.")}</p>
            `;
          } else {
            quizFeedbackBox.classList.add("bg-rose-500/10", "border", "border-rose-500/30", "text-rose-900");
            quizFeedbackBox.innerHTML = `
              <div class="flex items-center gap-2 font-bold text-rose-700">
                <span class="material-symbols-outlined text-lg">cancel</span>
                <span>Incorrect Choice</span>
              </div>
              <p class="text-xs text-rose-800/90 leading-relaxed">${escapeHtml(res.explanation || "Review the explanation above and continue learning.")}</p>
            `;
          }

          if (nextCardBtn) {
            nextCardBtn.disabled = false;
            nextCardBtn.title = "";
          }
          setNextBtnText((currentIndex === sequenceItems.length - 1) ? "Finish Lesson" : "Continue Lesson");

        } catch (err) {
          alert(err.message || "Failed to submit answer. Please try again.");
          quizSubmitBtn.disabled = false;
          quizSubmitBtn.textContent = isFinal ? "Submit Final Answer" : "Submit Answer";
        }
      });
    }
  }

  prevCardBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentItem();
    }
  });

  function showCompletionSummary() {
    stopTimers();
    const stepNum = stepData?.order_index || 1;
    const stepTitle = stepData?.step_title || "Bài học";

    const totalQuestions = sequenceItems.filter(i => i.type === 'checkpoint' || i.type === 'final_test').length;
    const attemptedQuestions = Object.keys(userAnswersMap).length;
    const correctCount = Object.values(userAnswersMap).filter(a => a.isCorrect).length;
    const incorrectCount = Math.max(0, attemptedQuestions - correctCount);
    const accuracyPct = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 100;

    const totalTimeEl = document.getElementById("total-lesson-timer");
    const formattedTime = totalTimeEl ? totalTimeEl.textContent : "00:00";

    lessonCardIndex.textContent = "BÀI HỌC HOÀN THÀNH";
    lessonCardTypeTag.textContent = "Báo cáo Kết quả Học tập";
    lessonCardTitle.textContent = `Kết quả Bài ${stepNum}: ${escapeHtml(stepTitle)}`;

    lessonCardBody.innerHTML = `
      <div class="flex flex-col items-center justify-center p-4 text-center gap-4 animate-fade-in-up my-auto">
        <div class="w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-600 flex items-center justify-center shadow-lg border border-emerald-500/30">
          <span class="material-symbols-outlined" style="font-size: 40px;">emoji_events</span>
        </div>

        <div class="space-y-1">
          <h2 class="font-headline-lg text-xl font-bold text-on-surface">🎉 Chúc mừng! Bạn đã hoàn thành Bài ${stepNum}!</h2>
          <p class="font-body-md text-xs text-on-surface-variant max-w-md leading-relaxed">
            Dưới đây là chi tiết kết quả câu hỏi và tổng thời gian học tập cho bài <strong>${escapeHtml(stepTitle)}</strong>.
          </p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-xl py-2">
          <div class="p-3 bg-surface-container-low rounded-xl border border-outline-variant/40 flex flex-col items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-primary text-xl mb-1">timer</span>
            <span class="font-display-lg text-base font-bold text-on-surface">${formattedTime}</span>
            <span class="text-[10px] text-on-surface-variant font-medium">Tổng thời gian học</span>
          </div>

          <div class="p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/30 flex flex-col items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-emerald-600 text-xl mb-1">check_circle</span>
            <span class="font-display-lg text-base font-bold text-emerald-700">${correctCount} / ${totalQuestions}</span>
            <span class="text-[10px] text-emerald-800 font-medium">Số câu đúng</span>
          </div>

          <div class="p-3 bg-rose-500/10 rounded-xl border border-rose-500/30 flex flex-col items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-rose-600 text-xl mb-1">cancel</span>
            <span class="font-display-lg text-base font-bold text-rose-700">${incorrectCount} / ${totalQuestions}</span>
            <span class="text-[10px] text-rose-800 font-medium">Số câu sai</span>
          </div>

          <div class="p-3 bg-secondary/10 rounded-xl border border-secondary/30 flex flex-col items-center justify-center shadow-sm">
            <span class="material-symbols-outlined text-secondary text-xl mb-1">query_stats</span>
            <span class="font-display-lg text-base font-bold text-secondary">${accuracyPct}%</span>
            <span class="text-[10px] text-secondary font-medium">Độ chính xác</span>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-2.5 w-full max-w-lg pt-1">
          <button id="review-lesson-btn" type="button" class="w-full py-3 bg-secondary text-on-secondary rounded-xl font-button font-bold text-xs shadow-md hover:opacity-90 transition-all flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">visibility</span>
            <span>Xem lại bài học & đáp án</span>
          </button>
          <button id="continue-next-lesson-btn" type="button" class="w-full py-3 bg-primary text-on-primary rounded-xl font-button font-bold text-xs shadow-md hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
            <span>Tiếp tục học bài mới</span>
            <span class="material-symbols-outlined text-base">arrow_forward</span>
          </button>
          <button id="close-lesson-modal-btn" type="button" class="w-full py-3 bg-surface-container-high text-on-surface rounded-xl font-button font-bold text-xs hover:bg-surface-variant transition-all border border-outline-variant/40 flex items-center justify-center gap-2">
            <span>Về Lộ trình</span>
          </button>
        </div>
      </div>
    `;

    document.getElementById("review-lesson-btn")?.addEventListener("click", () => {
      isReviewMode = true;
      currentIndex = 0;
      renderCurrentItem();
    });

    document.getElementById("continue-next-lesson-btn")?.addEventListener("click", () => {
      window.location.href = "personalized_learning_path.html";
    });

    document.getElementById("close-lesson-modal-btn")?.addEventListener("click", () => {
      window.location.href = "personalized_learning_path.html";
    });

    if (prevCardBtn) prevCardBtn.disabled = false;
    setNextBtnText("Xem lại bài học");
    nextCardBtn.onclick = () => {
      isReviewMode = true;
      currentIndex = 0;
      renderCurrentItem();
    };
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
});
</script>
</body>
</html>
