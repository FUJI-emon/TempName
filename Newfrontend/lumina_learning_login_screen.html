<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Lumina Learning - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Manrope:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                extend: {
                    "colors": {

                        "inverse-primary": "#c2c1ff",
                        "primary": "#4441cc",
                        "outline-variant": "#c7c4d7",

                        "on-primary-fixed-variant": "#332dbc",
                        "surface-variant": "#e2e2e7",
                        "on-primary-container": "#f4f1ff",
                        "surface-tint": "#4d4ad5",

                        "secondary-container": "#cb66fe",

                        "surface-dim": "#d9dade",

                        "tertiary-fixed": "#d6e3ff",
                        "on-tertiary-fixed": "#001b3e",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#7200a3",
                        "primary-fixed": "#e2dfff",
                        "on-secondary-container": "#4a006b",
                        "on-background": "#1a1c1f",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#006dd6",
                        "secondary": "#9026c3",
                        "on-surface": "#1a1c1f",
                        "on-surface-variant": "#464554",
                        "secondary-fixed-dim": "#e9b3ff",
                        "on-error": "#ffffff",
                        "surface": "#f9f9fe",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#f6d9ff",
                        "background": "#f9f9fe",

                        "primary-container": "#5e5ce6",
                        "surface-container-highest": "#e2e2e7",
                        "tertiary-fixed-dim": "#aac7ff"

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {
                        "base": "8px",
                        "container-padding": "32px",
                        "section-margin": "48px",
                        "card-gap": "24px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "button": ["Manrope"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"]

                    "fontSize": {

                }
            }
        }

<style>
        body { background-color: theme('colors.background'); }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-background">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/20 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container/20 blur-[80px]"></div>
</div>
<!-- TopNavBar (Hidden for transactional flow, but present in DOM per instructions to create components) -->
<!-- Navigation intentionally suppressed for Login page to prioritize content canvas. -->
<main class="w-full max-w-md px-container-padding z-10 relative">
<div class="glass-panel rounded-xl shadow-[0px_4px_20px_rgba(94,92,230,0.08)] p-8 w-full flex flex-col gap-6 hover:-translate-y-1 hover:shadow-xl transition-all duration-300">
<!-- Header -->
<div class="text-center space-y-2">
<div class="font-headline-md text-headline-md text-primary mb-4 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">school</span>
                    Lumina Learning
                </div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your learning journey</p>
</div>
<!-- Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow hover:-translate-y-1 hover:shadow-md transition-all duration-300" id="email" placeholder="alex@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow hover:-translate-y-1 hover:shadow-md transition-all duration-300" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-6 bg-primary hover:bg-surface-tint text-on-primary font-button text-button py-3 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98] hover:-translate-y-1 hover:shadow-lg duration-300" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-on-surface font-button text-button py-2 px-4 rounded-lg transition-colors hover:-translate-y-1 hover:shadow-md transition-all duration-300" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 bg-surface-container-lowest border border-outline-variant hover:bg-surface-container-low text-on-surface font-button text-button py-2 px-4 rounded-lg transition-colors hover:-translate-y-1 hover:shadow-md transition-all duration-300" type="button">
<span class="material-symbols-outlined text-xl">file_download</span>
                    Apple
                </button>
</div>
<!-- Footer -->
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Sign up</a>
</p>
</div>
</div>
</main>


<script src="./navigation.js?v=10"></script>
</body></html>
