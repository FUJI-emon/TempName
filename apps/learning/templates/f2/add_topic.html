{% extends 'learning/base.html' %}

{% block content %}
<style>
.form-container {
    max-width: 520px;
    margin: 50px auto;
    padding: 36px;
    background: var(--bg-surface);
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
    font-size: 0.95rem;
}

.form-group input[type="text"],
.form-group input[type="file"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-sm);
    box-sizing: border-box;
    background: var(--bg-app);
    color: var(--text-main);
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition-fast);
}

.form-group input[type="text"]:focus {
    border-color: var(--primary);
    background: var(--bg-surface);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

.btn-group {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 32px;
}

.btn-cancel {
    padding: 12px 24px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    text-decoration: none;
    color: var(--text-muted);
    font-weight: 700;
    background: var(--bg-surface);
    transition: var(--transition-fast);
}

.btn-cancel:hover {
    background: var(--bg-surface-elevated);
    color: var(--text-main);
}

.btn-submit {
    padding: 12px 24px;
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-indigo);
    transition: var(--transition-fast);
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -2px rgba(99, 102, 241, 0.45);
}
</style>

<div class="form-container">
    <h2 style="margin-top:0; margin-bottom: 24px; font-size: 1.4rem; color: var(--text-main); font-weight: 800;" data-i18n="addFile">ファイルを追加</h2>

    <form method="POST" enctype="multipart/form-data" onsubmit="showAiLoading('授業ファイルを解析中...', 'AIがファイルを読み込んで教材を準備しています。');">
        {% csrf_token %}

        <div class="form-group">
            <label for="title" data-i18n="title">タイトル</label>
            <input type="text" id="title" name="title" required placeholder="例: 第1回 微分積分">
        </div>

        <div class="form-group">
            <label for="document" data-i18n="lessonFile">授業ファイル (PDFなど)</label>
            <input type="file" id="document" name="document" required>
        </div>

        <div class="btn-group">
            <a href="{% url 'learning:topic_list' subject %}" class="btn-cancel" data-i18n="cancel">キャンセル</a>
            <button type="submit" class="btn-submit" data-i18n="addAndStartAnalysis">追加して解析開始</button>
        </div>
    </form>
</div>
{% endblock %}
