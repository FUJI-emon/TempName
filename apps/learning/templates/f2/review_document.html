{% extends 'learning/base.html' %}
{% load static %}

{% block content %}
<style>
.review-page-bg {
    min-height: calc(100vh - 80px);
    background: linear-gradient(135deg, #0b0f19 0%, #131b2e 50%, #1e1b4b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 20px;
    box-sizing: border-box;
    color: #ffffff;

    width: 100vw !important;
    position: relative !important;
    left: 50% !important;
    right: 50% !important;
    margin-left: -50vw !important;
    margin-right: -50vw !important;
}

.review-container {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.back-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.3rem;
    font-weight: bold;
    transition: var(--transition-fast);
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateX(-2px);
}

.page-title {
    font-size: 1.25rem;
    font-weight: 800;
}

.title-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.main-heading {
    font-size: 2.1rem;
    font-weight: 800;
    line-height: 1.35;
    margin: 0;
    color: #ffffff;
}

.sub-heading {
    color: #a5b4fc;
    font-size: 1rem;
    line-height: 1.6;
    margin: 0;
}

.card-box {
    background: #ffffff;
    border-radius: 28px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
}

.doc-name-badge {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 800;
    padding: 14px 20px;
    border-radius: 16px;
    font-size: 1rem;
    word-break: break-all;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 20px;
    background: #ffffff;
    cursor: pointer;
    transition: var(--transition-fast);
    user-select: none;
}

.section-item:hover {
    border-color: #a5b4fc;
    background: #f8fafc;
}

.section-item.checked {
    border-color: var(--primary);
    background: #eff6ff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
}

.checkbox-circle {
    width: 26px;
    height: 26px;
    border: 2px solid #cbd5e1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition-fast);
}

.section-item.checked .checkbox-circle {
    border-color: var(--primary);
    background: var(--primary);
}

.checkbox-circle::after {
    content: "✓";
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    display: none;
}

.section-item.checked .checkbox-circle::after {
    display: block;
}

.section-title-text {
    color: #1e293b;
    font-size: 1.05rem;
    font-weight: 700;
}

.submit-btn {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 20px;
    background: var(--primary-gradient);
    color: #ffffff;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    margin-top: 10px;
    transition: var(--transition-fast);
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(99, 102, 241, 0.55);
}
</style>

<div class="review-page-bg">
    <div class="review-container">

        <!-- Header -->
        <div class="review-header">
            <a href="javascript:history.back()" class="back-btn">‹</a>
            <div class="page-title" data-i18n="reviewDocument">資料の解析と確認</div>
            <div style="width: 44px;"></div>
        </div>

        <!-- Title Section -->
        <div class="title-section">
            <h1 class="main-heading" data-i18n="whichPartsUnderstood">理解できている部分は<br>どこですか？</h1>
            <p class="sub-heading" data-i18n="markSectionsDesc">すでに知っている部分にチェックを入れると、AIが重点的に学ぶべきステップ・復習カードを最適化します。</p>
        </div>

        <form method="POST" action="{% url 'learning:save_understanding' topic.id %}">
            {% csrf_token %}
            <input type="hidden" name="document_name" value="{{ document_name }}">
            <input type="hidden" name="subject" value="{{ subject }}">

            <!-- Cards Box -->
            <div class="card-box">
                <div class="doc-name-badge">
                    <span>📄</span> <span>{{ document_name }}</span>
                </div>

                {% for sec in sections %}
                <div class="section-item" onclick="toggleSection(this)">
                    <input type="checkbox" name="understood_sections" value="{{ sec.id }}" style="display: none;">
                    <div class="checkbox-circle"></div>
                    <span class="section-title-text">{{ sec.title }}</span>
                </div>
                {% endfor %}
            </div>

            <!-- CTA Submit Button -->
            <button type="submit" class="submit-btn" id="generate-path-btn" data-i18n="nextStep">
                AI Lộ trình học (Khởi tạo đợt 1) →
            </button>
        </form>

    </div>
</div>

<script>
function toggleSection(element) {
    const checkbox = element.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
        element.classList.add('checked');
    } else {
        element.classList.remove('checked');
    }
}

document.querySelector('form').addEventListener('submit', function() {
    if (typeof showAiLoading === 'function') {
        showAiLoading(
            '✨ AI đang khởi tạo Lộ trình học...',
            'Đang phân tích cá nhân hóa và khởi tạo tối đa 3 bài học cho đợt học đầu tiên.'
        );
    }
});
</script>
{% endblock %}
