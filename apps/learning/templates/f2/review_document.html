{% extends 'learning/base.html' %}
{% load static %}

{% block content %}
<style>
.review-page-bg {
    min-height: calc(100vh - 80px);
    background: #0b0f19;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    box-sizing: border-box;
    color: #ffffff;
}

.review-container {
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.back-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.1rem;
}

.page-title {
    font-size: 1.1rem;
    font-weight: 700;
}

.title-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.main-heading {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.3;
    margin: 0;
}

.sub-heading {
    color: #818cf8;
    font-size: 0.95rem;
    line-height: 1.5;
    margin: 0;
}

.card-box {
    background: #ffffff;
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.doc-name-badge {
    background: #f1f5f9;
    color: #6366f1;
    font-weight: 700;
    padding: 14px 20px;
    border-radius: 16px;
    font-size: 1rem;
    word-break: break-all;
}

.section-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border: 1.5 solid #e2e8f0;
    border-radius: 20px;
    background: #ffffff;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.section-item:hover {
    border-color: #a5b4fc;
    background: #f8fafc;
}

.section-item.checked {
    border-color: #6366f1;
    background: #eff6ff;
}

.checkbox-circle {
    width: 24px;
    height: 24px;
    border: 2px solid #cbd5e1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}

.section-item.checked .checkbox-circle {
    border-color: #6366f1;
    background: #6366f1;
}

.checkbox-circle::after {
    content: "✓";
    color: #ffffff;
    font-size: 14px;
    font-weight: bold;
    display: none;
}

.section-item.checked .checkbox-circle::after {
    display: block;
}

.section-title-text {
    color: #1e293b;
    font-size: 1rem;
    font-weight: 700;
}

.submit-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    margin-top: 10px;
}

.submit-btn:hover {
    opacity: 0.95;
}
</style>

<div class="review-page-bg">
    <div class="review-container">

        <!-- ヘッダー -->
        <div class="review-header">
            <a href="javascript:history.back()" class="back-btn">‹</a>
            <div class="page-title" data-i18n="reviewDocument">資料の確認</div>
            <div style="width: 38px;"></div>
        </div>

        <!-- タイトルセクション -->
        <div class="title-section">
            <h1 class="main-heading" data-i18n="whichPartsUnderstood">理解できている部分は<br>どこですか？</h1>
            <p class="sub-heading" data-i18n="markSectionsDesc">すでに知っている部分にチェックを入れると、AIが重点的に学ぶべき内容を最適化します。</p>
        </div>

        <form method="POST" action="{% url 'learning:save_understanding' topic.id %}">
            {% csrf_token %}
            <input type="hidden" name="document_name" value="{{ document_name }}">
            <input type="hidden" name="subject" value="{{ subject }}">

            <!-- カードエリア -->
            <div class="card-box">
                <div class="doc-name-badge">{{ document_name }}</div>

                {% for sec in sections %}
                <div class="section-item" onclick="toggleSection(this)">
                    <input type="checkbox" name="understood_sections" value="{{ sec.id }}" style="display: none;">
                    <div class="checkbox-circle"></div>
                    <span class="section-title-text">{{ sec.title }}</span>
                </div>
                {% endfor %}
            </div>

            <!-- 次へ進むボタン -->
            <button type="submit" class="submit-btn" data-i18n="nextStep">
                次へ進む →
            </button>
        </form>

    </div>
</div>

<script>
function toggleSection(element) {
    const checkbox = element.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
        element.classList.add('checked');
    } else {
        element.classList.remove('checked');
    }
}
</script>
{% endblock %}
