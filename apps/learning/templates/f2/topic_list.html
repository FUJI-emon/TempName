{% extends 'learning/base.html' %}
{% load static %}

{% block content %}
<style>
.topic-grid-container {
    padding: 36px 20px 80px 20px;
    max-width: 1140px;
    margin: 0 auto;
    min-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
}

.topic-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 16px;
}

.back-link {
    text-decoration: none;
    color: var(--text-muted);
    font-weight: 700;
    padding: 10px 18px;
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-md);
    background-color: var(--bg-surface);
    transition: var(--transition-fast);
    box-shadow: var(--shadow-sm);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.back-link:hover {
    background-color: var(--bg-surface-elevated);
    border-color: var(--text-subtle);
    color: var(--text-main);
}

.batch-delete-btn {
    background-color: var(--danger);
    color: #ffffff;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition-fast);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
}

.batch-delete-btn:hover:not(:disabled) {
    background-color: #dc2626;
    transform: translateY(-1px);
}

.batch-delete-btn:disabled {
    background-color: var(--border-light);
    color: var(--text-subtle);
    cursor: not-allowed;
    opacity: 0.6;
    box-shadow: none;
}

.topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    flex-grow: 1;
}

.topic-card {
    position: relative;
    background-color: var(--bg-surface);
    border: 1.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    min-height: 180px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    transition: var(--transition-normal);
    box-sizing: border-box;
}

.topic-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
}

.card-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 12px;
}

.card-action-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border-light);
    background: var(--bg-surface-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: var(--transition-fast);
}

.card-action-btn:hover {
    transform: scale(1.1);
    background: var(--primary-light);
    color: var(--primary);
}

.card-checkbox {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: var(--danger);
    margin: 0;
}

.card-title-input {
    width: 100%;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--text-main);
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: var(--radius-sm);
    padding: 6px;
    box-sizing: border-box;
    transition: var(--transition-fast);
    margin-bottom: 12px;
}

.card-title-input:hover {
    border-color: var(--border-light);
    background: var(--bg-app);
}

.card-title-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--bg-surface);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

.card-progress-bar {
    width: 100%;
    height: 8px;
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-pill);
    overflow: hidden;
    margin-bottom: 12px;
}

.card-progress-fill {
    height: 100%;
    background: var(--primary-gradient);
    border-radius: var(--radius-pill);
    transition: width 0.4s ease;
}

.card-bottom-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: var(--text-muted);
    font-size: 0.88rem;
    font-weight: 700;
    padding-top: 8px;
    border-top: 1px solid var(--border-light);
    transition: var(--transition-fast);
}

.card-bottom-link:hover {
    color: var(--primary);
}

.add-card {
    background-color: var(--bg-surface);
    border: 2px dashed var(--primary);
    justify-content: center;
    align-items: center;
    cursor: pointer;
    min-height: 180px;
    text-decoration: none;
}

.add-card:hover {
    background-color: var(--primary-light);
    transform: translateY(-4px);
}

.add-icon {
    font-size: 2.2rem;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--primary);
}

.add-text {
    font-size: 1rem;
    font-weight: 800;
    color: var(--primary);
}
</style>

<div class="topic-grid-container">
    <form id="batch-delete-form" action="{% url 'learning:batch_delete_topics' subject %}" method="POST" style="display: flex; flex-direction: column; flex-grow: 1;">
        {% csrf_token %}

        <div class="topic-header">
            <div class="header-left">
                <a href="{% url 'learning:dashboard' %}" class="back-link">‹ <span data-i18n="back">戻る</span></a>
                <h2 style="margin: 0; font-size: 1.6rem; color: var(--text-main); font-weight: 800;">{{ subject_name }} Topics</h2>
            </div>
            
            <button type="submit" id="batch-delete-btn" class="batch-delete-btn" disabled onclick="return confirm('選択した項目をまとめて削除しますか？');">
                🗑️ <span data-i18n="deleteSelected">選択した項目を削除</span> (<span id="selected-count">0</span>)
            </button>
        </div>

        <div class="topic-grid" id="topic-grid">
            <!-- Add File Card -->
            <a href="{% url 'learning:add_topic' subject %}" class="topic-card add-card">
                <div class="add-icon">+</div>
                <div class="add-text" data-i18n="addFile">ファイルを追加</div>
            </a>

            <!-- Existing Topics Grid -->
            {% for topic in topics %}
            <div class="topic-card">
                <div class="card-top-bar">
                    <button type="button" 
                            class="card-action-btn" 
                            title="名前を変更"
                            onclick="event.stopPropagation(); focusTitleInput('input-{{ topic.id }}');">
                        ✏️
                    </button>

                    <input type="checkbox" 
                           name="topic_ids" 
                           value="{{ topic.id }}" 
                           class="card-checkbox topic-checkbox" 
                           onclick="event.stopPropagation();" 
                           onchange="updateBatchDeleteBtn();">
                </div>

                <input type="text" 
                       id="input-{{ topic.id }}"
                       value="{{ topic.title }}" 
                       class="card-title-input" 
                       onclick="event.stopPropagation();"
                       onblur="handleTitleBlur(this, '{{ topic.id }}', '{{ topic.title|escapejs }}')"
                       onkeydown="if(event.key === 'Enter') { this.blur(); }">

                <div>
                    <div class="card-progress-bar">
                        <div class="card-progress-fill" style="width: {{ topic.progress }}%;"></div>
                    </div>

                    <a href="{% url 'learning:topic_detail' topic.id %}" 
                       class="card-bottom-link">
                        <span><span data-i18n="progress">進捗</span>: {{ topic.progress }}%</span>
                        <span>開く →</span>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </form>
</div>

<script>
function focusTitleInput(inputId) {
    const input = document.getElementById(inputId);
    if (input) {
        input.focus();
        input.select();
    }
}

function handleTitleBlur(inputElem, topicId, originalTitle) {
    const newTitle = inputElem.value.trim();
    if (newTitle && newTitle !== originalTitle) {
        submitTitleChange(topicId, newTitle);
    } else if (!newTitle) {
        inputElem.value = originalTitle;
    }
}

function submitTitleChange(topicId, newTitle) {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `/topic/${topicId}/edit-title/`;
    
    const csrfInput = document.createElement('input');
    csrfInput.type = 'hidden';
    csrfInput.name = 'csrfmiddlewaretoken';
    csrfInput.value = '{{ csrf_token }}';
    form.appendChild(csrfInput);

    const titleInput = document.createElement('input');
    titleInput.type = 'hidden';
    titleInput.name = 'title';
    titleInput.value = newTitle;
    form.appendChild(titleInput);

    document.body.appendChild(form);
    form.submit();
}

function updateBatchDeleteBtn() {
    const checkedBoxes = document.querySelectorAll('.topic-checkbox:checked');
    const btn = document.getElementById('batch-delete-btn');
    const countSpan = document.getElementById('selected-count');
    
    countSpan.textContent = checkedBoxes.length;
    btn.disabled = checkedBoxes.length === 0;
}
</script>
{% endblock %}
