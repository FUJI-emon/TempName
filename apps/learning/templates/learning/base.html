{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学習アプリ{% endblock %}</title>
    {% block extra_css %}{% endblock %}
    <style>
    /* 背景の暗転＋ボカシ処理 */
    .ai-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease-out;
    }
    .ai-loading-card {
        background: #ffffff;
        padding: 32px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        text-align: center;
        max-width: 380px;
        width: 85%;
    }
    .ai-spinner-container {
        position: relative;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .ai-icon-sparkle {
        font-size: 26px;
        animation: pulse 1.4s ease-in-out infinite;
    }

    /* アニメーション */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .ai-loading-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 8px 0;
    }

    .ai-loading-sub {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0;
        line-height: 1.5;
    }
    </style>
</head>
<body>

    <main>
        {% block content %}
        <!-- 各子画面（index.htmlなど）の中身がここにはめ込まれます -->
        {% endblock %}
    </main>

    <div id="ai-loading-overlay" class="ai-loading-overlay" style="display: none;">
        <div class="ai-loading-card">
            <div class="ai-spinner-container">
                <div class="spinner-ring"></div>
                <div class="ai-icon-sparkle">✨</div>
            </div>
            <h3 id="ai-loading-title" class="ai-loading-title">AIが思考中...</h3>
            <p id="ai-loading-sub" class="ai-loading-sub">コンテンツを解析しています。少々お待ちください。</p>
        </div>
    </div>

    <script>
    /* --- AI Loading 表示制御 --- */
    function showAiLoading(title = "AIが思考中...", sub = "コンテンツを解析しています。少々お待ちください。") {
        const overlay = document.getElementById('ai-loading-overlay');
        if (overlay) {
            document.getElementById('ai-loading-title').innerText = title;
            document.getElementById('ai-loading-sub').innerText = sub;
            overlay.style.display = 'flex';
        }
    }

    function hideAiLoading() {
        const overlay = document.getElementById('ai-loading-overlay');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    /* --- XP管理機能 --- */
    document.addEventListener("DOMContentLoaded", function() {
        updateXpDisplay();
    });

    function updateXpDisplay() {
        const currentXp = parseInt(localStorage.getItem('user_xp') || '0', 10);
        const xpElements = document.querySelectorAll('#user-xp, .xp-badge-value');
        xpElements.forEach(el => {
            el.textContent = currentXp + " XP";
        });
    }

    function addXp(amount) {
        let currentXp = parseInt(localStorage.getItem('user_xp') || '0', 10);
        currentXp += amount;
        localStorage.setItem('user_xp', currentXp);
        updateXpDisplay();
    }
    </script>
</body>
</html>
