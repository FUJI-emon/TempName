{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学習アプリ{% endblock %}</title>
    {% block extra_css %}{% endblock %}

    <!-- ⚡️ 画面読み込み直前にテーマを適用（白チラつき防止） -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("app_theme") || localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>

    <style>
    /* 🌐 全ページ共通ダークモード設定 */
    body {
        background-color: #f8fafc;
        color: #1e293b;
        transition: background-color 0.2s ease, color 0.2s ease;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html.dark-mode,
    body.dark-mode {
        background-color: #0f172a !important;
        color: #f8fafc !important;
    }

    /* 背景の暗転＋ボカシ処理 (AI Loading) */
    .ai-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease-out;
    }
    .ai-loading-card {
        background: #ffffff;
        padding: 32px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        text-align: center;
        max-width: 380px;
        width: 85%;
    }
    body.dark-mode .ai-loading-card {
        background: #1e293b;
        color: #f8fafc;
    }

    .ai-spinner-container {
        position: relative;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .ai-icon-sparkle {
        font-size: 26px;
        animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .ai-loading-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 8px 0;
    }
    body.dark-mode .ai-loading-title { color: #f8fafc; }

    .ai-loading-sub {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0;
        line-height: 1.5;
    }
    body.dark-mode .ai-loading-sub { color: #94a3b8; }

    /* 🌐 画面右下の言語切り替えフローティングボタン */
    .lang-switcher-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9990;
        display: flex;
        gap: 6px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        padding: 6px 10px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        border: 1px solid #e2e8f0;
    }
    body.dark-mode .lang-switcher-float {
        background: rgba(30, 41, 59, 0.9);
        border-color: #334155;
    }
    .lang-btn {
        border: none;
        background: transparent;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #64748b;
        cursor: pointer;
        transition: all 0.2s;
    }
    .lang-btn.active {
        background: #6366f1;
        color: #ffffff;
    }
    </style>
</head>

    /* 🌐 全ページ共通のユーザー名同期機能 */
    function applyGlobalUserName() {
        const savedName = localStorage.getItem("user_name");
        const lang = localStorage.getItem("app_language") || "ja";
        const dict = (window.i18nDictionary && window.i18nDictionary[lang]) ? window.i18nDictionary[lang] : { guestUser: "ゲストユーザー" };

        const displayName = (savedName && savedName.trim() !== "") ? savedName : dict.guestUser;

        document.querySelectorAll(".user-name-display").forEach(el => {
            el.textContent = displayName;
        });
    }

    /* 🌐 全ページ共通の言語適用機能 */
    function applyGlobalLanguage(lang) {
        const currentLang = lang || localStorage.getItem("app_language") || "ja";
        localStorage.setItem("app_language", currentLang);
        document.documentElement.lang = currentLang;

        const dict = window.i18nDictionary[currentLang] || window.i18nDictionary['ja'];

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (dict[key]) {
                if (dict[key].includes('<')) {
                    el.innerHTML = dict[key];
                } else {
                    el.textContent = dict[key];
                }
            }
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (dict[key]) {
                el.placeholder = dict[key];
            }
        });

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('lang-btn-' + currentLang);
        if (activeBtn) activeBtn.classList.add('active');

        applyGlobalUserName();

        if (typeof window.onLanguageChanged === 'function') {
            window.onLanguageChanged(currentLang);
        }
    }

    /* 🌟 テーマ切り替え機能 */
    function setTheme(theme) {
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
            localStorage.setItem("app_theme", "dark");
            localStorage.setItem("theme", "dark");
        } else {
            document.documentElement.classList.remove('dark-mode');
            document.body.classList.remove('dark-mode');
            localStorage.setItem("app_theme", "light");
            localStorage.setItem("theme", "light");
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const currentTheme = localStorage.getItem("app_theme") || localStorage.getItem("theme") || "light";
        if (currentTheme === "dark") {
            document.body.classList.add("dark-mode");
        }
        applyGlobalLanguage();
    });
    </script>
