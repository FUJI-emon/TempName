{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LearnAI Platform{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
    {% block extra_css %}{% endblock %}

    <!-- Anti-flicker Dark Theme script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("app_theme") || localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>

    <style>
    /* AI Loading Overlay Styling */
    .ai-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.25s ease-out;
    }
    .ai-loading-card {
        background: var(--bg-surface, #ffffff);
        padding: 36px 40px;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        text-align: center;
        max-width: 400px;
        width: 86%;
        border: 1px solid var(--border-light, #e2e8f0);
    }
    body.dark-mode .ai-loading-card {
        background: #131b2e;
        color: #f8fafc;
        border-color: #1e293b;
    }

    .ai-spinner-container {
        position: relative;
        width: 68px;
        height: 68px;
        margin: 0 auto 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 4px solid var(--border-light, #e2e8f0);
        border-top: 4px solid var(--primary, #6366f1);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .ai-icon-sparkle {
        font-size: 28px;
        animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .ai-loading-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--text-main, #0f172a);
        margin: 0 0 8px 0;
    }
    body.dark-mode .ai-loading-title { color: #f8fafc; }

    .ai-loading-sub {
        font-size: 0.88rem;
        color: var(--text-muted, #64748b);
        margin: 0;
        line-height: 1.5;
    }
    body.dark-mode .ai-loading-sub { color: #94a3b8; }

    /* Language Switcher Floating Pill */
    .lang-switcher-float {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9990;
        display: flex;
        gap: 4px;
        background: var(--bg-glass, rgba(255, 255, 255, 0.85));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 5px 8px;
        border-radius: var(--radius-pill, 9999px);
        box-shadow: var(--shadow-lg, 0 10px 25px rgba(0,0,0,0.12));
        border: 1.5px solid var(--border-light, #e2e8f0);
    }
    body.dark-mode .lang-switcher-float {
        background: rgba(19, 27, 46, 0.85);
        border-color: #1e293b;
    }
    .lang-btn {
        border: none;
        background: transparent;
        padding: 6px 14px;
        border-radius: var(--radius-pill, 9999px);
        font-size: 0.82rem;
        font-weight: 800;
        color: var(--text-muted, #64748b);
        cursor: pointer;
        transition: var(--transition-fast, all 0.15s);
    }
    .lang-btn.active {
        background: var(--primary-gradient, linear-gradient(135deg, #6366f1, #4f46e5));
        color: #ffffff;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }
    .app-top-nav {
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-light);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .app-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--text-main);
        text-decoration: none;
    }
    .app-nav-links {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .app-nav-link {
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: var(--transition-fast);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
    }
    .app-nav-link:hover, .app-nav-link.active {
        color: var(--primary);
        background: var(--primary-light);
    }
    .app-nav-cta {
        background: var(--primary-gradient);
        color: #ffffff;
        padding: 8px 18px;
        border-radius: var(--radius-pill);
        font-weight: 800;
        font-size: 0.85rem;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        transition: var(--transition-fast);
    }
    .app-nav-cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
    }
    </style>
</head>
<body>

    <header class="app-top-nav">
        <a href="{% url 'learning:dashboard' %}" class="app-brand">
            <span>✨</span> <span>LearnAI</span>
        </a>
        <nav class="app-nav-links">
            <a href="{% url 'learning:dashboard' %}" class="app-nav-link" data-i18n="navDashboard">ホーム</a>
            <a href="{% url 'learning:subject_select' %}" class="app-nav-link" data-i18n="navSubjects">教科一覧</a>
            <a href="{% url 'learning:profile' %}" class="app-nav-link" data-i18n="navProfile">プロフィール</a>
            <a href="{% url 'learning:dashboard' %}" class="app-nav-cta" data-i18n="continueBtn">学習を再開 →</a>
        </nav>
    </header>

    <main class="page-fade-in">
        {% block content %}
        {% endblock %}
    </main>


    <!-- AI Loading Overlay -->
    <div id="ai-loading-overlay" class="ai-loading-overlay" style="display: none;">
        <div class="ai-loading-card">
            <div class="ai-spinner-container">
                <div class="spinner-ring"></div>
                <div class="ai-icon-sparkle">✨</div>
            </div>
            <h3 id="ai-loading-title" class="ai-loading-title" data-i18n="aiThinking">AIが思考中...</h3>
            <p id="ai-loading-sub" class="ai-loading-sub" data-i18n="aiAnalyzing">コンテンツを解析しています。少々お待ちください。</p>
        </div>
    </div>

    <!-- Language Switcher Floating Button -->
    <div class="lang-switcher-float">
        <button type="button" class="lang-btn" id="lang-btn-ja" onclick="applyGlobalLanguage('ja')">🇯🇵 JP</button>
        <button type="button" class="lang-btn" id="lang-btn-en" onclick="applyGlobalLanguage('en')">🇺🇸 EN</button>
        <button type="button" class="lang-btn" id="lang-btn-vi" onclick="applyGlobalLanguage('vi')">🇻🇳 VN</button>
    </div>

    <script src="{% static 'js/main.js' %}?v=2"></script>
    <script>
    /* Global Username Apply */
    function applyGlobalUserName() {
        const savedName = localStorage.getItem("user_name");
        const lang = localStorage.getItem("app_language") || "ja";
        const dict = (window.i18nDictionary && window.i18nDictionary[lang]) ? window.i18nDictionary[lang] : { guestUser: "ゲストユーザー" };
        const displayName = (savedName && savedName.trim() !== "") ? savedName : dict.guestUser;

        document.querySelectorAll(".user-name-display").forEach(el => {
            el.textContent = displayName;
        });
    }

    /* Global Language Apply */
    function applyGlobalLanguage(lang) {
        const currentLang = lang || localStorage.getItem("app_language") || "ja";
        localStorage.setItem("app_language", currentLang);
        document.documentElement.lang = currentLang;

        const dict = window.i18nDictionary[currentLang] || window.i18nDictionary['ja'];

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (dict[key]) {
                if (dict[key].includes('<')) {
                    el.innerHTML = dict[key];
                } else {
                    el.textContent = dict[key];
                }
            }
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (dict[key]) {
                el.placeholder = dict[key];
            }
        });

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('lang-btn-' + currentLang);
        if (activeBtn) activeBtn.classList.add('active');

        applyGlobalUserName();

        if (typeof window.onLanguageChanged === 'function') {
            window.onLanguageChanged(currentLang);
        }
    }

    /* Theme Switcher */
    function setTheme(theme) {
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
            localStorage.setItem("app_theme", "dark");
            localStorage.setItem("theme", "dark");
        } else {
            document.documentElement.classList.remove('dark-mode');
            document.body.classList.remove('dark-mode');
            localStorage.setItem("app_theme", "light");
            localStorage.setItem("theme", "light");
        }
    }

    function showAiLoading(title = "AIが思考中...", sub = "コンテンツを解析しています。少々お待ちください。") {
        const overlay = document.getElementById('ai-loading-overlay');
        if (overlay) {
            document.getElementById('ai-loading-title').innerText = title;
            document.getElementById('ai-loading-sub').innerText = sub;
            overlay.style.display = 'flex';
        }
    }

    function hideAiLoading() {
        const overlay = document.getElementById('ai-loading-overlay');
        if (overlay) {
            overlay.style.display = 'none';
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const currentTheme = localStorage.getItem("app_theme") || localStorage.getItem("theme") || "light";
        if (currentTheme === "dark") {
            document.body.classList.add("dark-mode");
        }
        applyGlobalLanguage();
    });
    </script>
</body>
</html>
