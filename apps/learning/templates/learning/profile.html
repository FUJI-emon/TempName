{% extends 'learning/base.html' %}
{% load static %}

{% block title %}プロフィール | LearnAI Platform{% endblock %}

{% block content %}
<style>
.profile-container {
    max-width: 580px;
    margin: 40px auto;
    padding: 0 20px 80px 20px;
}

.profile-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
}

.top-bar-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1.5px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    font-size: 1.1rem;
    color: var(--text-main);
    text-decoration: none;
    transition: var(--transition-fast);
}

.top-bar-btn:hover {
    transform: scale(1.05);
    background: var(--bg-surface-elevated);
    border-color: var(--primary);
    color: var(--primary);
}

.profile-page-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-main);
    margin: 0;
}

.profile-card {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    padding: 40px 32px;
    box-shadow: var(--shadow-md);
    border: 1.5px solid var(--border-light);
    text-align: center;
    transition: var(--transition-normal);
}

.profile-avatar-wrapper {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: var(--accent-gradient);
    margin: 0 auto 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    box-shadow: var(--shadow-indigo);
    position: relative;
    overflow: hidden;
    color: #ffffff;
}

.profile-avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: none;
}

.profile-user-name {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text-main);
    margin: 0 0 6px 0;
}

.profile-user-role {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin: 0 0 32px 0;
    font-weight: 600;
}

.profile-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.stat-box {
    background: var(--bg-app);
    border-radius: var(--radius-md);
    padding: 22px 18px;
    text-align: center;
    border: 1.5px solid var(--border-light);
    transition: var(--transition-fast);
}

.stat-box:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
}

.stat-value {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--primary);
    margin-bottom: 4px;
}

.stat-label {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 700;
}
</style>

<div class="profile-container">
    <div class="profile-top-bar">
        <a href="javascript:history.back()" class="top-bar-btn" title="戻る">‹</a>
        <h1 class="profile-page-title" data-i18n="profile">Profile</h1>
        <a href="{% url 'learning:settings' %}" class="top-bar-btn" title="設定">⚙️</a>
    </div>

    <div class="profile-card">
        <div class="profile-avatar-wrapper">
            <span id="profileAvatarEmoji">👧</span>
            <img id="profileAvatarImg" class="profile-avatar-img" src="" alt="Profile Avatar" />
        </div>

        <h2 class="profile-user-name user-name-display">ゲストユーザー</h2>
        <p class="profile-user-role" data-i18n="studentAccount">Student Account</p>

        <div class="profile-stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="profileXpValue">0 XP</div>
                <div class="stat-label" data-i18n="earnedScore">獲得スコア</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="profileStreakValue">0日</div>
                <div class="stat-label" data-i18n="streakStudy">連続学習</div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const savedAvatar = localStorage.getItem("dash_user_avatar");
    if (savedAvatar) {
        document.getElementById("profileAvatarEmoji").style.display = "none";
        const img = document.getElementById("profileAvatarImg");
        img.src = savedAvatar;
        img.style.display = "block";
    }

    updateProfileXp();
    updateProfileStreak();
});

window.onLanguageChanged = function(lang) {
    updateProfileXp();
    updateProfileStreak();
};

function updateProfileXp() {
    const xp = parseInt(localStorage.getItem('user_xp') || localStorage.getItem('dash_user_xp') || '0', 10);
    const xpEl = document.getElementById("profileXpValue");
    if (xpEl) {
        xpEl.textContent = `${xp.toLocaleString()} XP`;
    }
}

function updateProfileStreak() {
    const streak = parseInt(localStorage.getItem('quiz_streak_count') || '0', 10);
    const streakEl = document.getElementById("profileStreakValue");
    const lang = localStorage.getItem("app_language") || "ja";
    const unit = (lang === 'en') ? ' Days' : (lang === 'vi') ? ' Ngày' : '日';

    if (streakEl) {
        streakEl.textContent = `${streak}${unit}`;
    }
}
</script>
{% endblock %}
