{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebApp Title{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="app-header" style="position: relative;">
        <div class="header-container">
            <a href="{% url 'learning:index' %}" class="logo"> <!--ここでヘッダを押したときの行先のURLを書き換える-->
                <span class="logo-icon">💡</span>
                <span class="logo-text">WebApp Title</span>
            </a>

            <div style="position: absolute; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: normal; color: #333;">
                {% block page_title %}{% endblock %}
            </div>
            
            <button class="header-badge" id="nameEditBtn">
                {% if request.COOKIES.user_name %}
                  こんにちは、{{request.COOKIES.user_name }}さん
                {% else %}
                  Guest--名前が未登録です--
                {% endif %}
            </button>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="nameModalOverlay" class="modal-overlay hidden">
        <div class="name-edit-modal card">
            <h3 style="margin-bottom: 16px; font-size: 16px; color: #111827;">ユーザー名の変更</h3>
            <input type="text" id="nameInput" placeholder="新しい名前を入力" class="name-input-field">
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelNameBtn" style="padding: 6px 16px; font-size: 12px;">キャンセル</button>
                <button class="btn-primary" id="saveNameBtn" style="padding: 6px 16px; font-size: 12px;">保存</button>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; WebApp Title name ー FUJI-emon</p>
            <p class="footer-subtext">学習状況・習熟度を管理して、AI先生がサポートしてくれる学習アプリ</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}?v=1"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
