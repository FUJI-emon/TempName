{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/chat.css' %}">
{% endblock %}

{% block content %}
<div class="chat-container">
    <!-- ヘッダー -->
    <div class="chat-header">
        <a href="/topics/{{ topic.subject }}/" class="back-btn-circle">‹</a>
        <h1 class="chat-title">AI Assistant</h1>
        <div class="header-menu">•••</div>
    </div>

    <!-- チャットメッセージエリア -->
    <div class="chat-messages">
        <!-- AIからの挨拶メッセージ -->
        <div class="message-row-ai">
            <div class="ai-avatar">🤖</div>
            <div class="message-content">
                <div class="ai-meta">
                    <span class="ai-name">New Study AI</span>
                    <span class="ai-badge">assistant</span>
                </div>
                <div class="chat-bubble-ai">
                    Hello! Which subject would you like to study? Choose a suggested subject below or enter your own!
                </div>
            </div>
        </div>
    </div>

    <!-- 入力フォームエリア -->
    <div class="chat-input-area">
        <form class="input-box-wrapper" onsubmit="return false;">
            <a href="/topic/{{ topic.id }}/upload/" class="upload-plus-btn" title="ドキュメントを追加">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </a>
            
            <input type="text" class="chat-input" placeholder="Course Introduction..." />
            <button type="submit" class="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
